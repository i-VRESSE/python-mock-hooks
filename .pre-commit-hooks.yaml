# yaml-language-server: $schema=https://raw.githubusercontent.com/j178/prek/master/prek-hooks.schema.json
- id: python-mock-hooks
  name: Check mocking policy
  description: Restrict monkeypatch, unittest.mock, and mocker.patch in tests.
  entry: python-mock-hooks
  language: python
  types: [python]
  files: ^tests/.*\.py$
  require_serial: true
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
