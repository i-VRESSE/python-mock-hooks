repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ast-grep-rule-tests
        name: Test testing policy rules
        language: python
        entry: ast-grep test --config sgconfig.yml
        additional_dependencies: ["ast-grep-cli==0.45.2"]
        pass_filenames: false
        files: ^(src/python_mock_hooks/(rules|if-rules)/|tests/|sgconfig\.yml$)
