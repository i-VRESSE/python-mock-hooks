name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run prek validate-manifest .pre-commit-hooks.yaml
      - run: uv run ast-grep test --config sgconfig.yml
      - run: uv run pytest
      - run: uv run pyrefly check
      - run: uv run prek run --all-files
